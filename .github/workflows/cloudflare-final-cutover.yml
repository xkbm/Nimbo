# Validación de CI para pushes a cloudflare-test.
#
# HISTORIAL: este workflow era el pipeline de cutover original (17-ago) y re-ejecutaba
# la migración del snapshot SQLite contra la base de producción en cada push. Con la
# base evolucionada eso es incorrecto y rompe por FK (runs #349/#350, cuenta fantasma
# 2287f4af eliminada en la reconexión OAuth). Hoy el deploy canónico es manual/wrangler
# (scripts/deploy-pages.ps1), así que este workflow queda REDUCIDO a validación pura:
# sin escrituras a la base, sin deploys que compitan con el pipeline manual.
# El pipeline completo de cutover sigue disponible en el historial de git si algún día
# hiciera falta reprovisionar desde cero.

name: Cloudflare final cutover

on:
  push:
    branches:
      - cloudflare-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # The worker serves the SPA via [assets] (frontend/dist); the dry-run
      # fails if the directory does not exist, so build it first.
      - name: Build frontend (required by [assets] validation)
        run: pnpm --filter frontend build
      - name: Prepare legacy adapters
        run: pnpm --filter worker prepare:legacy
      - name: Validate Worker bundle
        run: npx wrangler@4.123.0 deploy --dry-run
        working-directory: worker
